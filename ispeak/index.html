<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Sound Buttons</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100vw;
      height: 100vh;
    }

    button {
      border: none;
      font-size: 2vw;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-1 { background: #e74c3c; } /* red */
    .btn-2 { background: #07cf5e; } /* blue */
    .btn-3 { background: #078aee; } /* green */
    .btn-4 { background: #f39c12; } /* orange */
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-1" onclick="playSound('sound1')">No</button>
    <button class="btn-2" onclick="playSound('sound2')">Yes</button>
    <button class="btn-3" onclick="playSound('sound3')">Pani</button>
    <button class="btn-4" onclick="playSound('sound4')">Salaam</button>
  </div>

  <!-- Audio elements -->
  <audio id="sound1" src="audio/No.m4a"></audio>
  <audio id="sound2" src="audio/Yes.m4a"></audio>
  <audio id="sound3" src="audio/Pani.m4a"></audio>
  <audio id="sound4" src="audio/Salaam.m4a"></audio>

  <script>
    function playSound(id) {
      const audio = document.getElementById(id);
      audio.currentTime = 0;
      audio.play();
    }
  </script>

</body>
</html>
