<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Sound Buttons</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100vw;
      height: 100vh;
    }

    button {
      border: none;
      font-size: clamp(20px, 20vw, 100px);
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-1 { background: #f3796c; }
    .btn-2 { background: #33eb83; }
    .btn-3 { background: #7fd9fc; }
    .btn-4 { background: #fdec66; }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-1" data-sound="sound1">❌</button>
    <button class="btn-2" data-sound="sound2">✅</button>
    <button class="btn-3" data-sound="sound3">🧃</button>
    <button class="btn-4" data-sound="sound4">👋</button>
  </div>

  <!-- Audio elements -->
  <audio id="sound1" src="audio/No.m4a" preload="auto"></audio>
  <audio id="sound2" src="audio/Yes.m4a" preload="auto"></audio>
  <audio id="sound3" src="audio/Pani.m4a" preload="auto"></audio>
  <audio id="sound4" src="audio/Salaam.m4a" preload="auto"></audio>

  <script>
      // Define audios with custom volume
  const audios = {
    sound1: { element: document.getElementById('sound1'), volume: 0.7 },  // louder
    sound2: { element: document.getElementById('sound2'), volume: 1.0 },  // normal
    sound3: { element: document.getElementById('sound3'), volume: 0.7 },
    sound4: { element: document.getElementById('sound4'), volume: 0.8 }
  };

  // Button click to play sounds
  document.querySelectorAll('.container button').forEach(button => {
    button.addEventListener('click', () => {
      const audioObj = audios[button.dataset.sound];
      const audio = audioObj.element;
      audio.volume = audioObj.volume;   // set custom volume
      audio.currentTime = 0;
      audio.play();
    });
  });
  </script>

</body>
</html>
