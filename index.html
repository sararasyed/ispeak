<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Sound Buttons</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100vw;
      height: 100vh;
    }

    button {
      border: none;
      font-size: 10vw;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-1 { background: #f3796c; }
    .btn-2 { background: #33eb83; }
    .btn-3 { background: #7fd9fc; }
    .btn-4 { background: #fdec66; }

    /* Full-screen popover */
    .popover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
    }

    .popover button {
      background: black;
      color: white;
      font-size: 5vw;
      padding: 1em 2em;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Full-screen popover -->
  <div class="popover" id="introPopover">
    <button id="letsGoBtn">Start</button>
  </div>

  <div class="container">
    <button class="btn-1" data-sound="sound1">❌</button>
    <button class="btn-2" data-sound="sound2">✅</button>
    <button class="btn-3" data-sound="sound3">🧃</button>
    <button class="btn-4" data-sound="sound4">👋</button>
  </div>

  <!-- Audio elements -->
  <audio id="sound1" src="audio/No.m4a" preload="auto"></audio>
  <audio id="sound2" src="audio/Yes.m4a" preload="auto"></audio>
  <audio id="sound3" src="audio/Pani.m4a" preload="auto"></audio>
  <audio id="sound4" src="audio/Salaam.m4a" preload="auto"></audio>

  <script>
    const audios = {
      sound1: document.getElementById('sound1'),
      sound2: document.getElementById('sound2'),
      sound3: document.getElementById('sound3'),
      sound4: document.getElementById('sound4')
    };

    const popover = document.getElementById('introPopover');
    const letsGoBtn = document.getElementById('letsGoBtn');

// Function to silently unlock audio on mobile
function unlockAudioSilently() {
  Object.values(audios).forEach(audio => {
    const originalVolume = audio.volume;
    audio.volume = 0;          // mute
    audio.play().then(() => {
      audio.pause();           // stop immediately
      audio.currentTime = 0;   // reset
      audio.volume = originalVolume; // restore volume
    }).catch(() => {});
  });
}

// Handle "Start" click
letsGoBtn.addEventListener('click', () => {
  unlockAudioSilently();      // Unlock audio silently
  popover.style.display = 'none'; // Hide popover
});

    // Button click to play sounds
    document.querySelectorAll('.container button').forEach(button => {
      button.addEventListener('click', () => {
        const audio = audios[button.dataset.sound];
        audio.currentTime = 0; 
        audio.play();
      });
    });
  </script>

</body>
</html>
